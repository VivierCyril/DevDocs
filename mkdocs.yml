site_name: Dev Docs
repo_url: https://github.com/VivierCyril/DevDocs
repo_name: "Github"
site_description: Cours et documentation des technologies informtique
site_author: Vivier Cyril
remote_branch: main
remote_name: origin

# Permet de mettre un projet en construction
# draft_docs: HTML/

# Utilise les lien URL sans extension
use_directory_urls: true

# Défini le dossier
docs_dir: docs

nav:
  - Accueil:
      - index.md
  - Les langages:
      - HTML:
          - HTML/index.md
      - CSS:
          - CSS/index.md
      - JS:
          - base: JS/index.md
          - avancé: JS/javascript/avancee.md
  - A propos:
      - License: license.md
      - Release Notes: release-notes.md

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - yaml
  locale: fr